version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: naporta-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: naporta_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d naporta_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: naporta-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/naporta_db?schema=public
      JWT_SECRET: naporta-super-secret-jwt-key-2026
      JWT_EXPIRES_IN: 1d
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
